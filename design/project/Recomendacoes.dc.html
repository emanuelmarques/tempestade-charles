<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Tempestade Charles — O que fazer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
body{margin:0;background:#F5F3EE;color:#15202B;font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3,.h{font-family:'Space Grotesk',Inter,sans-serif;margin:0}
a{color:#1B4F9C}a:hover{color:#123A74}
a:focus-visible,button:focus-visible{outline:3px solid #1B4F9C;outline-offset:2px}
.shape{display:inline-block;width:12px;height:12px;flex:none;box-sizing:border-box}
.sh-g{background:#1B4F9C;border-radius:2px}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid;line-height:1.4}
.cat-g{color:#1B4F9C;border-color:#1B4F9C;background:#E9F0FA}
.lv{display:inline-flex;align-items:center;padding:2px 10px;border-radius:6px;font-weight:700;font-size:13px;line-height:1.5}
.lv-vermelho{background:#D1242F;color:#fff}
.card{background:#fff;border:1px solid #DDD8CC;border-radius:12px;padding:20px;box-sizing:border-box}
.tab{min-height:44px;padding:0 18px;border-radius:8px;border:1.5px solid #15202B;background:#fff;color:#15202B;font:600 15px Inter,sans-serif;cursor:pointer}
.tab.on{background:#15202B;color:#fff}
.seg{min-height:44px;padding:0 14px;border:1.5px solid #15202B;background:#fff;color:#15202B;font:600 14px Inter,sans-serif;cursor:pointer}
.seg.on{background:#15202B;color:#fff}
.muted{color:#4A5663}
</style>
</helmet>

<div style="min-height:100%">

  <div style="background:#15202B;color:#fff">
    <div style="max-width:1200px;margin:0 auto;padding:10px 40px;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:8px 32px;align-items:center;justify-content:space-between">
      <span class="h" style="font-weight:600;font-size:15px;letter-spacing:.02em;text-transform:uppercase">Em emergência</span>
      <div style="display:flex;flex-wrap:wrap;gap:8px 28px">
        <a href="tel:112" style="color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:10px;min-height:44px"><span class="h" style="font-size:26px;font-weight:700">112</span><span style="font-size:14px">Emergência</span></a>
        <a href="tel:808242424" style="color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:10px;min-height:44px"><span class="h" style="font-size:26px;font-weight:700">808 24 24 24</span><span style="font-size:14px">SNS 24</span></a>
      </div>
    </div>
  </div>

  <header style="border-bottom:1px solid #DDD8CC;background:#F5F3EE">
    <div style="max-width:1200px;margin:0 auto;padding:24px 40px;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:16px">
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none" aria-hidden="true"><rect width="44" height="44" rx="10" fill="#15202B"/><path d="M12 17c0-4 3.4-7 7.5-7 3 0 5.600 1.600 6.800 4 3.500.200 6.200 2.700 6.200 6s-2.800 6-6.300 6H15c-2.200 0-3-1.700-3-3.500z" fill="#fff"/><path d="M23 25l-4 7h4l-2 6 7-9h-4l2-4z" fill="#F4C20D"/></svg>
        <p class="h" style="margin:0;font-size:30px;line-height:1.1;font-weight:700">Tempestade Charles</p>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center">
        <p style="margin:0;display:inline-flex;align-items:center;gap:10px;font-size:15px"><span style="width:10px;height:10px;border-radius:50%;background:#0E6B63;flex:none"></span><span><strong>Atualizado às 14:30</strong> <span class="muted">· há 4 min</span></span></p>
        <div style="display:flex" role="group" aria-label="Idioma">
          <button class="seg on" aria-pressed="true" style="border-radius:8px 0 0 8px">PT</button>
          <button class="seg" aria-pressed="false" style="border-radius:0 8px 8px 0;border-left:0">EN</button>
        </div>
      </div>
    </div>
  </header>

  <main style="max-width:1200px;margin:0 auto;padding:32px 40px 56px;box-sizing:border-box;display:flex;flex-direction:column;gap:24px">
    <a href="Main.dc.html" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;font-weight:600;align-self:flex-start">← Voltar ao início</a>

    <section aria-labelledby="h-rec">
      <h1 id="h-rec" style="font-size:36px;line-height:1.15;margin-bottom:8px">O que fazer</h1>
      <p style="margin:0 0 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:17px" class="muted">Nível em vigor na sua zona: <span class="lv lv-vermelho">Vermelho</span></p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px" role="group" aria-label="Situação">
        <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="3">
          <button class="tab {{tab.on}}" aria-pressed="{{tab.pressed}}" onClick="{{tab.pick}}">{{tab.label}}</button>
        </sc-for>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:14px">
        <sc-for list="{{recs}}" as="r" hint-placeholder-count="6">
          <div class="card" style="display:flex;gap:16px;padding:20px">
            <span class="h" style="flex:none;width:36px;height:36px;border-radius:50%;background:#15202B;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px">{{r.n}}</span>
            <div><h2 style="font-size:20px;margin-bottom:4px">{{r.title}}</h2><p style="margin:0;font-size:16px" class="muted">{{r.text}}</p></div>
          </div>
        </sc-for>
      </div>
      <p style="margin:20px 0 0;font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center" class="muted">Conselhos de: <span class="badge cat-g"><span class="shape sh-g"></span>Governamental · ANEPC <a href="#" style="margin-left:4px">Fonte</a></span></p>
    </section>
  </main>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sit: 'casa' };
  }
  renderVals() {
    const sit = this.state.sit;
    const tabsDef = [['casa', 'Em casa'], ['estrada', 'Na estrada'], ['costa', 'Perto da costa']];
    const tabs = tabsDef.map(([id, label]) => ({
      label, on: sit === id ? 'on' : '', pressed: sit === id ? 'true' : 'false',
      pick: () => this.setState({ sit: id })
    }));
    const RECS = {
      casa: [
        ['Fique em casa', 'Se possível, evite sair enquanto durar o aviso.'],
        ['Afaste-se de janelas', 'Evite portas e janelas de vidro; fique em divisões interiores.'],
        ['Recolha objetos', 'Prenda ou guarde vasos, toldos e mobiliário no exterior.'],
        ['Prepare luz e comunicações', 'Lanterna, rádio a pilhas e telemóvel carregado.'],
        ['Não se abrigue sob árvores', 'Árvores, postes e placards podem cair com o vento.'],
        ['Siga a Proteção Civil', 'Acompanhe as indicações das autoridades da sua zona.']
      ],
      estrada: [
        ['Evite deslocações', 'Só viaje se for mesmo necessário.'],
        ['Reduza a velocidade', 'Aumente a distância de segurança e agarre bem o volante.'],
        ['Não atravesse zonas alagadas', 'Nem vias com árvores ou cabos elétricos caídos.'],
        ['Estacione longe de árvores', 'E de placards e linhas elétricas.']
      ],
      costa: [
        ['Afaste-se da orla costeira', 'Evite molhes, falésias e passeios marítimos.'],
        ['Não vá ver as ondas', 'Ondas fortes arrastam pessoas sem aviso.'],
        ['Retire equipamentos', 'Embarcações e material em zonas expostas.'],
        ['Siga as autoridades marítimas', 'E as indicações da Proteção Civil local.']
      ]
    };
    return { tabs, recs: RECS[sit].map((r, i) => ({ n: i + 1, title: r[0], text: r[1] })) };
  }
}
</script>
</body>
</html>

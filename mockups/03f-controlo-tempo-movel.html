<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mockup 03f · Controlo (linha do tempo + painel móvel)</title>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;400;600&family=Familjen+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b12;--panel:rgba(14,22,34,.82);--line:rgba(140,180,220,.2);--tx:#dbe7f3;--mut:#7f93a8;--cy:#45e0ff;--font:'Familjen Grotesk',sans-serif;--mono:'Martian Mono',monospace;--peek:196px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:400 16px/1.45 var(--font);overflow:hidden}
.app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(1200px 700px at 36% 40%,#0f2236 0%,#070b12 70%)}
.app:before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.28;mask-image:radial-gradient(circle at 36% 50%,#000,transparent 75%)}
.g{background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px}
/* mapa */
#map{position:absolute;inset:78px 400px 132px 0;transition:transform .45s cubic-bezier(.3,.8,.3,1);transform-origin:50% 25%}#map svg{width:100%;height:100%;filter:drop-shadow(0 0 22px rgba(69,224,255,.12))}
.dist{cursor:pointer;transition:fill .5s}.dist:hover{filter:brightness(1.35)}.pulse{animation:pu 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center;display:none}.pulse.on{display:block}@keyframes pu{0%{opacity:.7;transform:scale(.3)}100%{opacity:0;transform:scale(1.6)}}
/* topo */
.hd{position:absolute;left:16px;right:16px;top:14px;display:flex;gap:10px;z-index:5;align-items:stretch}
.brand{padding:10px 16px;display:flex;gap:12px;align-items:center;margin-right:auto}.brand b{font:700 20px var(--font)}.brand span{font:300 11px var(--mono);color:var(--mut);letter-spacing:.1em}.dot{width:9px;height:9px;border-radius:50%;background:#ff3b4a;box-shadow:0 0 12px #ff3b4a;animation:b 1.4s infinite}@keyframes b{50%{opacity:.3}}
.cdc{padding:8px 14px}.cdc small{font:300 9.5px var(--mono);color:var(--mut);letter-spacing:.16em;display:block}.cdc b{font:600 22px var(--mono);letter-spacing:-.04em}
.tel{padding:10px 16px;display:flex;gap:18px;align-items:center;font:400 13px var(--mono)}.tel a{color:var(--tx);text-decoration:none}.tel b{color:#ff6b78}
.sos{display:none;width:60px;border-radius:16px;background:#e5242f;color:#fff;font:700 20px var(--font);place-items:center;text-decoration:none;box-shadow:0 0 24px #e5242f66}
.when{position:absolute;left:28px;top:92px;z-index:3;pointer-events:none}.when small{font:300 11px var(--mono);letter-spacing:.2em;color:var(--mut);display:block}.when b{font:600 clamp(40px,6vw,78px)/1 var(--mono);letter-spacing:-.05em;color:#fff;text-shadow:0 0 30px #45e0ff44}.when span{font:400 14px var(--mono);color:var(--cy)}
/* linha do tempo */
.dock{position:absolute;left:16px;right:416px;bottom:16px;padding:14px 20px 12px;z-index:4}
.ctl{display:flex;align-items:center;gap:14px}.play{width:48px;height:48px;border-radius:50%;border:1px solid var(--cy);background:#45e0ff1a;color:var(--cy);font-size:17px;cursor:pointer;flex:none}
.tm{display:none;flex:none;font:600 20px var(--mono);letter-spacing:-.04em;min-width:64px}.tm small{display:block;font:300 9px var(--mono);letter-spacing:.1em;color:var(--mut)}
.sw{flex:1;position:relative;height:56px}.prof{position:absolute;left:0;right:0;top:0;height:30px;width:100%}
input[type=range]{position:absolute;left:0;right:0;top:12px;width:100%;appearance:none;background:transparent;height:30px;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,#45e0ff44,#F4C20D88,#EE7B1E,#D1242F,#EE7B1E,#45e0ff44)}
input[type=range]::-webkit-slider-thumb{appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-9px;box-shadow:0 0 0 5px #45e0ff55,0 0 18px #fff}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:linear-gradient(90deg,#45e0ff44,#F4C20D88,#EE7B1E,#D1242F,#EE7B1E,#45e0ff44)}input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:0}
.ticks{position:absolute;left:0;right:0;top:40px;display:flex;justify-content:space-between;font:300 10px var(--mono);color:var(--mut);pointer-events:none}
.spd{display:flex;gap:4px}.spd button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:6px 9px;cursor:pointer;font:400 11px var(--mono)}.spd button.on{color:var(--cy);border-color:var(--cy)}
/* painel: lateral no desktop, folha inferior no telemóvel */
.sheet{position:absolute;right:16px;top:78px;bottom:16px;width:370px;z-index:6;display:flex;flex-direction:column;overflow:hidden}
.grab{display:none;padding:10px 0 4px;place-items:center;cursor:pointer;background:none;border:0;width:100%}.grab i{width:44px;height:5px;border-radius:3px;background:#ffffff40}
.sc{overflow:auto;padding:16px 18px 24px;flex:1}
.zh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:10px}.zh b{font:700 26px var(--font)}.badge{font:600 11px var(--mono);padding:4px 10px;border-radius:7px;color:#000}
select{width:100%;font:600 17px var(--font);background:#0a1624;color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.stat div{background:#ffffff0d;border-radius:12px;padding:9px 4px;text-align:center}.stat b{font:600 18px var(--mono);display:block;letter-spacing:-.04em}.stat small{font:300 8.5px var(--mono);color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.cnt{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;text-align:center}.cnt div{border-radius:12px;padding:8px 4px;background:#ffffff0a}.cnt b{font:600 24px var(--mono);display:block}.cnt small{font:300 9px var(--mono);color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:16px 0 6px;position:sticky;top:-16px;background:linear-gradient(#0e1622 85%,#0e162200);padding:8px 0;z-index:2}.tabs button{font:400 12px var(--mono);background:#ffffff0d;color:var(--mut);border:0;border-radius:99px;padding:9px 14px;cursor:pointer}.tabs button.on{background:var(--cy);color:#001018;font-weight:600}
.pn{display:none}.pn.on{display:block}
.fi{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:14.5px}.fi time{font:600 12px var(--mono);color:var(--cy)}.fi small{display:block;color:var(--mut);font:300 10.5px var(--mono);margin-top:4px}
.sv{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}.sv b{font:600 10px var(--mono);color:#ff9a3d;text-transform:uppercase;white-space:nowrap}
.rc{padding:12px 0;border-top:1px solid var(--line)}.rc b{font:700 17px var(--font);display:block}.rc span{color:var(--mut);font-size:14px}
.lbl{font:400 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin:14px 0 8px;display:flex;justify-content:space-between}
.help{position:absolute;left:28px;bottom:140px;font:300 11px var(--mono);color:var(--mut);z-index:3;pointer-events:none}
/* ===== telemóvel ===== */
@media(max-width:900px){
  .brand span,.tel,.when,.help{display:none}.sos{display:grid}.brand{padding:10px 14px}.brand b{font-size:17px}
  .hd{left:10px;right:10px;top:10px}
  #map{inset:150px 0 0 0}.app[data-s="1"] #map{transform:translateY(-70px) scale(.82)}.app[data-s="2"] #map{transform:translateY(-120px) scale(.62)}
  .dock{left:10px;right:10px;top:72px;bottom:auto;padding:8px 12px 4px}.play{width:40px;height:40px}.tm{display:block}.spd{display:none}.sw{height:48px}.prof{height:22px}.ticks{top:34px}
  .sheet{left:0;right:0;top:0;bottom:0;width:auto;border-radius:28px 28px 0 0;border-bottom:0;transform:translateY(calc(100% - var(--peek)));transition:transform .4s cubic-bezier(.3,.8,.3,1)}
  .app[data-s="1"] .sheet{transform:translateY(48%)}.app[data-s="2"] .sheet{transform:translateY(150px)}
  .grab{display:grid}.sc{padding-top:4px;padding-bottom:90px}
}
</style></head><body>
<div class="app" id="app" data-s="0">
  <div class="hd"><div class="g brand"><span class="dot"></span><b>Tempestade Charles</b><span>SIMULAÇÃO DA JANELA PREVISTA</span></div>
    <div class="g cdc"><small>T-MENOS · 00:00 11 NOV</small><b data-cd>00:00:00</b></div>
    <div class="g tel"><a href="tel:112">EMERGÊNCIA <b>112</b></a><a href="tel:808242424">SNS 24 <b>808 24 24 24</b></a></div><a class="sos" href="tel:112">112</a></div>
  <div class="when"><small id="wd">DESLIZE A LINHA DO TEMPO</small><b id="wt">20:10</b><span id="wr"></span></div>
  <div class="help">toque num distrito · ▶ para simular</div>
  <div id="map"></div>
  <div class="g dock"><div class="ctl"><button class="play" id="play" aria-label="Reproduzir">▶</button><div class="tm"><span id="wt2">20:10</span><small id="wd2">AGORA</small></div>
    <div class="sw"><svg class="prof" id="prof" viewBox="0 0 100 30" preserveAspectRatio="none"></svg><input id="rng" type="range" min="0" max="1000" value="0" aria-label="Instante da simulação"><div class="ticks" id="tick"></div></div>
    <div class="spd" id="spd"><button class="on" data-s="1">1×</button><button data-s="2">2×</button><button data-s="4">4×</button></div></div></div>
  <section class="g sheet" aria-label="Painel">
    <button class="grab" id="grab" aria-label="Expandir ou recolher painel"><i></i></button>
    <div class="sc">
      <div class="zh"><b id="zn">Lisboa</b><span class="badge" id="zb"></span></div>
      <select id="sel" aria-label="Distrito"></select>
      <div class="stat"><div><b id="rw">38</b><small>vento km/h</small></div><div><b id="rh">3.2</b><small>ondas m</small></div><div><b id="rr">2</b><small>chuva mm/h</small></div><div><b id="zs">0</b><small>impacto</small></div></div>
      <div class="lbl"><span>Distritos por nível</span><span id="ri"></span></div><div class="cnt" id="cnt"></div>
      <div class="tabs" id="tabs"><button class="on" data-t="feed">Relatos</button><button data-t="warn">Avisos</button><button data-t="svc">Serviços</button><button data-t="rec">Fazer</button></div>
      <div class="pn on" id="feed"></div><div class="pn" id="warn"></div><div class="pn" id="svc"></div><div class="pn" id="rec"></div>
    </div>
  </section>
</div>
<script src="data.js"></script><script src="common.js"></script>
<script>
const {M,LV,CAT,esc,hm,ago,map,bindMap,byId}=C;const D=id=>document.getElementById(id);const app=D('app');
const T0=Date.parse('2026-11-10T20:10:00Z'),T1=Date.parse('2026-11-12T08:00:00Z'),PEAK=Date.parse('2026-11-11T12:00:00Z'),START=Date.parse('2026-11-11T00:00:00Z');
const CL={vermelho:'#ff3b4a',laranja:'#ff8a1f',amarelo:'#f4c20d',verde:'#3b4a5c'};
const prof=t=>Math.exp(-Math.pow((t-PEAK)/(7.5*3600e3),2));
const lvl=s=>s>=62?'vermelho':s>=38?'laranja':s>=14?'amarelo':'verde';
let cur='lisboa',T=T0;
const pul=M.districts.map(d=>`<circle class="pulse" data-p="${d.id}" cx="${d.lx}" cy="${d.ly}" r="24" fill="none" stroke="#ff3b4a" stroke-width="1.5"/>`).join('');
D('map').innerHTML=map({fill:()=>CL.verde,land:'#0d1a29',landAttrs:'stroke="#1c3550"',stroke:'#070b12',sw:1.6,pad:6,over:pul});
D('prof').innerHTML=`<path d="M0 30 ${Array.from({length:101},(_,i)=>`L${i} ${30-prof(T0+(T1-T0)*i/100)*26}`).join(' ')} L100 30Z" fill="#45e0ff22" stroke="#45e0ff88" stroke-width=".6" vector-effect="non-scaling-stroke"/>`;
D('tick').innerHTML=['20h','00h','06h','12h','18h','00h','06h'].map(x=>`<span>${x}</span>`).join('');
const sel=D('sel');sel.innerHTML=M.districts.map(d=>`<option value="${d.id}">${d.name}</option>`).join('');
function update(){
  const k=prof(T),f=.42+.58*k;
  M.districts.forEach(d=>{const s=Math.min(100,d.score*f*1.18);d._s=s;d._l=lvl(s);document.querySelector(`.dist[data-id="${d.id}"]`).setAttribute('fill',CL[d._l]);document.querySelector(`[data-p="${d.id}"]`).classList.toggle('on',d._l==='vermelho')});
  const dt=new Date(T),opt={timeZone:'Europe/Lisbon'};
  const hh=dt.toLocaleTimeString('pt-PT',{...opt,hour:'2-digit',minute:'2-digit'}),dd=dt.toLocaleDateString('pt-PT',{...opt,weekday:'long',day:'numeric',month:'long'});
  D('wt').textContent=hh;D('wt2').textContent=hh;D('wd').textContent=dd.toUpperCase();D('wd2').textContent=dt.toLocaleDateString('pt-PT',{...opt,weekday:'short',day:'numeric'}).toUpperCase();
  const dm=Math.round((START-T)/60000);D('wr').textContent=dm>0?`faltam ${Math.floor(dm/60)}h${String(dm%60).padStart(2,'0')} para o início`:`${Math.floor(-dm/60)}h${String(-dm%60).padStart(2,'0')} desde o início`;
  D('rw').textContent=Math.round(32+88*k);D('rh').textContent=(2.6+7.4*k).toFixed(1);D('rr').textContent=Math.round(1+19*k);D('ri').textContent='intensidade '+Math.round(k*100)+'%';
  const c={vermelho:0,laranja:0,amarelo:0};M.districts.forEach(d=>{if(c[d._l]!=null)c[d._l]++});
  D('cnt').innerHTML=Object.entries(c).map(([l,n])=>`<div><b style="color:${CL[l]}">${n}</b><small>${l}</small></div>`).join('');
  zone(cur)}
function zone(id){cur=id;const d=byId(id);sel.value=id;D('zn').textContent=d.name;D('zb').textContent=LV[d._l||d.level].toUpperCase();D('zb').style.background=CL[d._l||d.level];D('zs').textContent=Math.round(d._s||d.score);
  document.querySelectorAll('.dist').forEach(p=>{const on=p.dataset.id===id;p.setAttribute('stroke',on?'#fff':'#070b12');p.setAttribute('stroke-width',on?'3':'1.6')});
  const el=document.querySelector(`.dist[data-id="${id}"]`);el.parentNode.appendChild(el)}
sel.onchange=()=>zone(sel.value);bindMap(D('map'),id=>{zone(id);if(app.dataset.s==='2')app.dataset.s='1'});
D('rng').oninput=()=>{T=T0+(T1-T0)*D('rng').value/1000;update()};
let timer=null,sp=1;
D('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;D('play').textContent='▶';return}if(+D('rng').value>=1000)D('rng').value=0;D('play').textContent='❚❚';timer=setInterval(()=>{D('rng').value=+D('rng').value+sp*2;if(+D('rng').value>=1000){clearInterval(timer);timer=null;D('play').textContent='▶'}D('rng').oninput()},50)};
D('spd').onclick=e=>{const b=e.target.closest('button');if(!b)return;sp=+b.dataset.s;document.querySelectorAll('#spd button').forEach(x=>x.classList.toggle('on',x===b))};
D('grab').onclick=()=>{app.dataset.s=String((+app.dataset.s+1)%3)};
D('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pn').forEach(p=>p.classList.toggle('on',p.id===b.dataset.t));if(app.dataset.s==='0')app.dataset.s='1'};
D('feed').innerHTML=M.feed.map(f=>`<div class="fi"><time>${hm(f.time)}</time><div>${esc(f.title)}<small>${esc(f.src)} · ${CAT[f.cat]} · ${ago(f.time)}</small></div></div>`).join('');
D('warn').innerHTML=M.warnings.map(w=>`<div class="fi" style="grid-template-columns:14px 1fr"><i style="width:10px;height:10px;border-radius:3px;background:${CL[w.lvl]};margin-top:6px"></i><div><b>${w.what}</b><small>${w.where} · ${w.from} → ${w.to}</small></div></div>`).join('');
D('svc').innerHTML=M.services.map(s=>`<div class="sv"><span>${esc(s.name.slice(0,100))}${s.name.length>100?'…':''}</span><b>${s.status.replace('_',' ')}</b></div>`).join('');
D('rec').innerHTML=M.recs.map(([a,b])=>`<div class="rc"><b>${a}</b><span>${b}</span></div>`).join('');
update();
</script></body></html>
